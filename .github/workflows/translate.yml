name: Traduci le ricette nuove

on:
  schedule:
    - cron: "17 3 1 * *"   # il 1° di ogni mese alle 03:17 UTC (le 4 o le 5 in Italia)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installa
        run: pip -q install firebase-admin
      - name: Traduci le ricette nuove o modificate
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python .github/scripts/translate_recipes.py
